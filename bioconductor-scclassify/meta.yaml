package:
  name: bioconductor-scclassify
  version: 1.22.0
source:
  url:
    - https://bioarchive.galaxyproject.org/scClassify_1.22.0.tar.gz
    - https://bioconductor.org/packages/3.22/bioc/src/contrib/Archive/scClassify/scClassify_1.22.0.tar.gz
    - https://bioconductor.org/packages/3.22/bioc/src/contrib/scClassify_1.22.0.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-scclassify/bioconductor-scclassify_1.22.0_src_all.tar.gz
  md5: ab6a829b02c74366aeef2337b813ff3c
build:
  number: '0'
  rpaths:
    - lib/
    - lib/R/lib/
  noarch: generic
requirements:
  host:
    - bioconductor-biocparallel
    - bioconductor-cepo
    - bioconductor-hopach
    - bioconductor-limma
    - bioconductor-s4vectors
    - r-base
    - r-cluster
    - r-diptest
    - r-ggplot2
    - r-ggraph
    - r-igraph
    - r-matrix
    - r-mgcv
    - r-minpack.lm
    - r-mixtools
    - r-proxy
    - r-proxyc
    - r-statmod
  run:
    - bioconductor-biocparallel
    - bioconductor-cepo
    - bioconductor-hopach
    - bioconductor-limma
    - bioconductor-s4vectors
    - r-base
    - r-cluster
    - r-diptest
    - r-ggplot2
    - r-ggraph
    - r-igraph
    - r-matrix
    - r-mgcv
    - r-minpack.lm
    - r-mixtools
    - r-proxy
    - r-proxyc
    - r-statmod
test:
  commands:
    - $R -e "library('scClassify')"
about:
  home: https://bioconductor.org/packages/3.22/bioc/html/scClassify.html
  license: GPL-3
  summary: 'scClassify: single-cell Hierarchical Classification'
  description: scClassify is a multiscale classification framework for single-cell
    RNA-seq data based on ensemble learning and cell type hierarchies, enabling sample
    size estimation required for accurate cell type classification and joint classification
    of cells using multiple references.
