{% set name = "bioconductor-immapex" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://bioconductor.org/packages/3.22/bioc/src/contrib/Archive/immApex/immApex_1.4.0.tar.gz
  sha256: 0ea1d1130150ea4017b784fc34862027e0008fa4a454ca08a31143f71c389277

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  host:
    - r-base
    - bioconductor-singlecellexperiment
    - r-hash
    - r-httr
    - r-matrix
    - r-matrixstats
    - r-rcpp
    - r-rvest
    - r-stringr

  run:
    - r-base
    - bioconductor-singlecellexperiment
    - r-hash
    - r-httr
    - r-matrix
    - r-matrixstats
    - r-rcpp
    - r-rvest
    - r-stringr

test:
  commands:
    - $R -e "library('immApex')"

about:
  home: https://github.com/BorchLab/immApex
  dev_url: https://github.com/BorchLab/immApex
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: 'Tools for Adaptive Immune Receptor Sequence-Based Machine and Deep Learning'
  description: |
    A set of tools for machine and deep learning in R from amino acid and nucleotide sequences focusing
    on adaptive immune receptors. The package includes pre-processing of sequences, unifying gene
    nomenclature usage, encoding sequences, and combining models.
