
package:
  name: r-metap
  version: 1.14.0
source:
  url:
    - https://cran.r-project.org/src/contrib/metap_1.14.tar.gz

build:
  number: 1
  # no skip

  # This is required to make R link correctly on Linux.
  rpaths:
    - lib/R/lib/
    - lib/

requirements:

  host:
    - r-base
    - r-lattice
    - r-rdpack
    - r-tfisher
    - r-mathjaxr
    - r-qqconf
    - r-mutoss

  run:
    - r-base
    - r-lattice
    - r-rdpack
    - r-tfisher
    - r-mathjaxr
    - r-qqconf
    - r-mutoss

test:
  commands:
    # You can put additional test commands to be run here.
    - $R -e "library('metap')"           # [not win]

about:
  home: https://cran.r-project.org/package=metap
  license: GPL-2
  summary: Meta-analysis of p-values.
  license_family: GPL-2
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2'
