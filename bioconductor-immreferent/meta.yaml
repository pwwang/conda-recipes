{% set name = "bioconductor-immreferent" %}
{% set version = "1.1.0" %}
{% set rb = r_base|default("4.5") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

# immReferent declares R (>= 4.5.0) -> R 4.5+ only.
source:
  url:
    - https://bioconductor.org/packages/3.24/bioc/src/contrib/immReferent_1.1.0.tar.gz
    - https://bioconductor.org/packages/3.24/bioc/src/contrib/Archive/immReferent/immReferent_1.1.0.tar.gz
  sha256: f4c9cd943da95d0dc812451353c12df76067f7ba60a5a582d03ae07e561195db

build:
  number: 1
  # Depends: R (>= 4.5.0) -- never build for an older R
  skip: {{ rb != "4.5" }}
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  host:
    - r-base
    - bioconductor-biostrings =2.78
    - bioconductor-iranges
    - r-httr
    - r-jsonlite
    - r-rvest
    - r-tibble
    - r-yaml

  run:
    - r-base
    - bioconductor-biostrings =2.78
    - bioconductor-iranges
    - r-httr
    - r-jsonlite
    - r-rvest
    - r-tibble
    - r-yaml

test:
  commands:
    - $R -e "library('immReferent')"

about:
  home: https://github.com/BorchLab/immReferent
  dev_url: https://github.com/BorchLab/immReferent
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: 'Consistent interface to immune receptor and HLA reference sequences'
  description: |
    Provides a consistent interface for downloading, storing, and accessing immune receptor (TCR/BCR)
    and HLA sequences from IMGT, IPD-IMGT/HLA, and OGRDB (AIRR-C), with local caching.
