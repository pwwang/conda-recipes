package:
  name: bioconductor-ucell
  version: 2.14.0
source:
  url:
    - https://bioarchive.galaxyproject.org/UCell_2.14.0.tar.gz
    - https://bioconductor.org/packages/3.22/bioc/src/contrib/Archive/UCell/UCell_2.14.0.tar.gz
    - https://bioconductor.org/packages/3.22/bioc/src/contrib/UCell_2.14.0.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-ucell/bioconductor-ucell_2.14.0_src_all.tar.gz
  md5: c7e5305d8821b2fc2fa2cdccd9848636
build:
  number: '0'
  rpaths:
    - lib/
    - lib/R/lib/
  noarch: generic
requirements:
  host:
    - bioconductor-biocneighbors
    - bioconductor-biocparallel
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment
    - r-base
    - r-data.table
    - r-matrix
  run:
    - bioconductor-biocneighbors
    - bioconductor-biocparallel
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment
    - r-base
    - r-data.table
    - r-matrix
test:
  commands:
    - $R -e "library('UCell')"
about:
  home: https://bioconductor.org/packages/3.22/bioc/html/UCell.html
  license: GPL-3 + file LICENSE
  summary: Rank-based signature enrichment analysis for single-cell data
  description: UCell is a package for evaluating gene signatures in single-cell datasets.
    UCell signature scores, based on the Mann-Whitney U statistic, are robust to dataset
    size and heterogeneity, and their calculation demands less computing time and
    memory than other available methods, enabling the processing of large datasets
    in a few minutes even on machines with limited computing power. UCell can be applied
    to any single-cell data matrix, and includes functions to directly interact with
    SingleCellExperiment and Seurat objects.
  license_file: LICENSE
