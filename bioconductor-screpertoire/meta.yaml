{% set name = "bioconductor-screpertoire" %}
{% set version = "2.7.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/BorchLab/scRepertoire/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 11c4f2442a9fc7dd8a8dda999b5608aff138b27569c7f456ff25fa2cf70b3402

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  host:
    - r-base
    - bioconductor-s4vectors
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment
    - bioconductor-immapex >=1.4.0,<1.5
    - r-dplyr
    - r-evmix
    - r-ggalluvial
    - r-ggplot2
    - r-ggdendro
    - r-ggraph
    - r-igraph
    - r-inext
    - r-lifecycle
    - r-matrix
    - r-purrr
    - r-quantreg
    - r-rcpp
    - r-rjson
    - r-rlang
    - r-seuratobject
    - r-tidygraph

  run:
    - r-base
    - bioconductor-s4vectors
    - bioconductor-singlecellexperiment
    - bioconductor-summarizedexperiment
    - bioconductor-immapex >=1.4.0,<1.5
    - r-dplyr
    - r-evmix
    - r-ggalluvial
    - r-ggplot2
    - r-ggdendro
    - r-ggraph
    - r-igraph
    - r-inext
    - r-lifecycle
    - r-matrix
    - r-purrr
    - r-quantreg
    - r-rcpp
    - r-rjson
    - r-rlang
    - r-seuratobject
    - r-tidygraph

test:
  commands:
    - $R -e "library('scRepertoire')"
    - $R -e "library('scRepertoire'); stopifnot(packageVersion('immApex') >= '1.4.0', packageVersion('scRepertoire') == '2.7.3')"

about:
  home: https://github.com/BorchLab/scRepertoire
  dev_url: https://github.com/BorchLab/scRepertoire
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: 'A toolkit for single-cell immune profiling'
  description: |
    Single-cell sequencing is an emerging technology in the field of immunology and oncology that allows researchers to
    couple RNA quantification and other modalities, like immune cell receptor profiling at the level of an individual cell.
