package:
  name: truvari
  version: 5.5.0
source:
  url: https://pypi.org/packages/source/t/truvari/truvari-5.5.0.tar.gz
  sha256: 58aa2dc02de37597ba57ae18a2b32c662157e0e03d65f584a5b75e525a402d50
build:
  number: '0'
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation --no-cache-dir --use-pep517 -vvv
  entry_points:
    - truvari = truvari.__main__:main
requirements:
  host:
    - pip
    - python
    - setuptools >=69
  run:
    - intervaltree
    - joblib
    - mafft
    - numpy
    - pandas
    - psutil
    - pyabpoa
    - pyarrow
    - pysam
    - pytabix
    - python
    - python-edlib
    - pywfa
    - rich
test:
  imports:
    - truvari
  commands:
    - truvari --help
about:
  home: https://github.com/ACEnglish/truvari
  summary: Structural variant comparison tool for VCFs.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/ACEnglish/truvari
  doc_url: https://github.com/acenglish/truvari/wiki
