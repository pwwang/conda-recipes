package:
  name: bioconductor-glmgampoi
  version: 1.22.0
source:
  url:
    - https://bioarchive.galaxyproject.org/glmGamPoi_1.22.0.tar.gz
    - https://bioconductor.org/packages/3.22/bioc/src/contrib/Archive/glmGamPoi/glmGamPoi_1.22.0.tar.gz
    - https://bioconductor.org/packages/3.22/bioc/src/contrib/glmGamPoi_1.22.0.tar.gz
    - https://depot.galaxyproject.org/software/bioconductor-glmgampoi/bioconductor-glmgampoi_1.22.0_src_all.tar.gz
  md5: 18e48614cc222291ead18ac8c4679035
build:
  number: '1'
  rpaths:
    - lib/
    - lib/R/lib/
requirements:
  host:
    - bioconductor-assorthead
    - bioconductor-beachmat
    - bioconductor-biocgenerics
    - bioconductor-delayedarray >=0.38
    - bioconductor-delayedmatrixstats
    - bioconductor-hdf5array
    - bioconductor-matrixgenerics
    - pwwang::bioconductor-s4vectors >=0.50
    - bioconductor-singlecellexperiment
    - bioconductor-sparsearray
    - bioconductor-summarizedexperiment
    - libblas
    - libgcc
    - liblapack
    - liblzma
    - libstdcxx
    - libzlib
    - r-base
    - r-matrix
    - r-matrixstats
    - r-rcpp
    - r-rcpparmadillo
    - r-rlang
    - r-vctrs
  run:
    - bioconductor-assorthead
    - bioconductor-beachmat
    - bioconductor-biocgenerics
    - bioconductor-delayedarray >=0.38
    - bioconductor-delayedmatrixstats
    - bioconductor-hdf5array
    - bioconductor-matrixgenerics
    - pwwang::bioconductor-s4vectors >=0.50
    - bioconductor-singlecellexperiment
    - bioconductor-sparsearray
    - bioconductor-summarizedexperiment
    - libblas
    - libgcc
    - liblapack
    - liblzma
    - libstdcxx
    - libzlib
    - r-base
    - r-matrix
    - r-matrixstats
    - r-rcpp
    - r-rcpparmadillo
    - r-rlang
    - r-vctrs
test:
  commands:
    - $R -e "library('glmGamPoi')"
about:
  home: https://bioconductor.org/packages/3.22/bioc/html/glmGamPoi.html
  license: GPL-3
  summary: Fit a Gamma-Poisson Generalized Linear Model
  description: Fit linear models to overdispersed count data. The package can estimate
    the overdispersion and fit repeated models for matrix input. It is designed to
    handle large input datasets as they typically occur in single cell RNA-seq experiments.
