{% set version = '1.3.16' %}

package:
  name: r-hdf5r
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/hdf5r_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/hdf5r/hdf5r_{{ version }}.tar.gz
  sha256: 4cdfb76ae0f65dfcfbcf9b013959f942dad69c89bd481cc3b425c8b084e153b3

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}
    - make
    - pkg-config
  host:
    - r-base
    - r-bit64
    - r-r6
    - hdf5 1.14.3.*
    - zlib
  run:
    - r-base
    - r-bit64
    - r-r6
    - hdf5 1.14.3.*

test:
  commands:
    - $R -e "library('hdf5r')"

about:
  home: https://hhoeflin.github.io/hdf5r/
  dev_url: https://github.com/hhoeflin/hdf5r/
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: 'HDF5 is a data model, library, and file format for storing and managing large amounts of data. This package provides a nearly feature complete, object oriented wrapper for the HDF5 API.'
