
package:
  name: r-tensorflow
  version: 2.14.0
source:
  sha256: 7df9d2d2ca22648c4099ac29522b3bbf8a3d876bfb962470f6df0a86f25867ff
  url:
    - https://cran.r-project.org/src/contrib/Archive/tensorflow/tensorflow_2.14.0.tar.gz
    - https://cran.r-project.org/src/contrib/tensorflow_2.14.0.tar.gz
build:
  noarch: generic
  number: '0'
  rpaths:
    - lib/
    - lib/R/lib/
requirements:
  host:
    - r-base
    - r-config
    - r-lifecycle
    - r-processx
    - r-reticulate
    - r-rstudioapi
    - r-tfautograph
    - r-tfruns
    - r-yaml
    - tensorflow
  run:
    - r-base
    - r-config
    - r-lifecycle
    - r-processx
    - r-reticulate
    - r-rstudioapi
    - r-tfautograph
    - r-tfruns
    - r-yaml
    - tensorflow
test:
  commands:
    - $R -e "library('tensorflow')"
about:
  home: https://github.com/rstudio/tensorflow
  license: Apache License 2.0
  license_family: APACHE
  summary: Interface to 'TensorFlow' <https://www.tensorflow.org/>, an open source
    software library for numerical computation using data flow graphs. Nodes in the
    graph represent mathematical operations, while the graph edges represent the multidimensional
    data arrays (tensors) communicated between them. The flexible architecture allows
    you to deploy computation to one or more 'CPUs' or 'GPUs' in a desktop, server,
    or mobile device with a single 'API'. 'TensorFlow' was originally developed by
    researchers and engineers working on the Google Brain Team within Google's Machine
    Intelligence research organization for the purposes of conducting machine learning
    and deep neural networks research, but the system is general enough to be applicable
    in a wide variety of other domains as well.
